<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fair Play</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'> <rect width='64' height='64' rx='14' fill='%230B1F17'/> <circle cx='32' cy='32' r='21' fill='none' stroke='%23C6F432' stroke-width='4.5'/> <path d='M11 32h42' stroke='%23C6F432' stroke-width='4.5'/> <circle cx='32' cy='32' r='7.5' fill='%23C6F432'/></svg>">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Fair Play">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1F17; --surface:#11291F; --surface2:#163226; --border:#24443A;
  --text:#EEF5EF; --muted:#8FA89A; --accent:#C6F432; --accent-ink:#0B1F17;
  --danger:#FF6B5E; --radius:12px;
  --cond:'Barlow Condensed',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block}
.hidden{display:none!important}

/* ---------- layout ---------- */
.screen{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 24px);max-width:480px;margin:0 auto}
.screen.with-nav{padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
.push{margin-top:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:800;font-size:19px;letter-spacing:.04em;margin-bottom:28px}
.brand svg{width:24px;height:24px;color:var(--accent)}
h1{font-family:var(--body);font-weight:700;font-size:28px;line-height:1.15;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:14px;line-height:1.45;margin-top:6px}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}

/* ---------- welcome ---------- */
.welcome{justify-content:center;text-align:center}
.welcome .hero{margin:auto 0;display:flex;flex-direction:column;align-items:center}
.welcome .hero svg{width:84px;height:84px;color:var(--accent)}
.welcome .hero h1{font-family:var(--cond);font-weight:800;font-size:58px;letter-spacing:.03em;margin-top:18px}
.welcome .hero p{color:var(--text);opacity:.85;font-size:15px;line-height:1.45;max-width:270px;margin-top:10px}

/* ---------- forms ---------- */
.field{margin-top:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.input{width:100%;height:48px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);padding:0 14px;font-size:15px;outline:none;transition:border-color .15s}
.input::placeholder{color:#6B8577}
.input:focus{border-color:var(--accent)}
.field .msg{display:none;color:var(--danger);font-size:12.5px;margin-top:6px}
.invalid .input,.input.invalid{border-color:var(--danger)}
.invalid .msg{display:block}
.form-error{color:var(--danger);font-size:14px;margin-top:14px;min-height:1px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:10px;font-weight:700;font-size:15px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-outline{border:1.5px solid var(--border);color:var(--text)}
.btn-accent-outline{border:1.5px solid var(--accent);color:var(--accent)}
.btn-danger{border:1.5px solid rgba(255,107,94,.5);color:var(--danger)}
.btn+.btn{margin-top:10px}
.btn-sm{height:36px;width:auto;padding:0 14px;font-size:13px;border-radius:999px}
.btn svg{width:18px;height:18px}

/* ---------- provinces ---------- */
.prov{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border);font-weight:700;font-size:15px;text-align:left;margin-bottom:10px;transition:border-color .15s}
.prov:hover,.prov.on{border-color:var(--accent)}
.prov .pi{width:32px;height:32px;flex:none}
.prov .chev{margin-left:auto;width:18px;height:18px;color:var(--muted)}

/* ---------- team form ---------- */
.logo-up{width:104px;height:104px;border-radius:16px;border:1.5px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;overflow:hidden;position:relative}
.logo-up.invalid{border-color:var(--danger);color:var(--danger)}
.logo-up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logo-up svg{width:24px;height:24px}
.player{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border);margin-bottom:10px;position:relative}
.player .ph{width:52px;height:52px;border-radius:50%;background:var(--surface2);border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;overflow:hidden;color:var(--muted)}
.player .ph img{width:100%;height:100%;object-fit:cover}
.player .ph svg{width:20px;height:20px}
.player .pf{flex:1;min-width:0}
.player .pn{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.player .row{display:flex;gap:8px}
.player .input{height:40px;font-size:14px;padding:0 10px;min-width:0}
.player .rm{position:absolute;top:8px;right:10px;color:var(--muted);width:22px;height:22px}

/* ---------- app shell & nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#0E251B;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav .nav-brand,.nav .nav-foot{display:none}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 10px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);position:relative}
.nav-item svg{width:20px;height:20px}
.nav-item.on{color:var(--accent)}
.nav-item.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav-item .dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--danger)}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.topbar .who{flex:1;min-width:0;text-align:left}
.topbar .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who span{font-size:12px;color:var(--muted)}

.logo{border-radius:50%;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:800;color:#0B1F17;background:var(--accent)}
.logo img{width:100%;height:100%;object-fit:cover}

/* ---------- calendar ---------- */
.month{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.month b{font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.02em}
.month .arrows{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:16px;height:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 6px}
.cal .wd{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding-bottom:4px}
.day{position:relative;aspect-ratio:1;border-radius:9px;background:var(--surface);border:1.5px solid transparent;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.day:hover:not(:disabled){border-color:var(--border)}
.day:disabled{background:transparent;color:#3E5A4D;cursor:default}
.day.today{color:var(--accent)}
.day.placed{border:1.5px dashed var(--accent)}
.day.matched{background:var(--accent);color:var(--accent-ink)}
.day .cnt{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.day.matched .cnt{display:none}
.day .ball{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:22px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ---------- lists & cards ---------- */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border);margin-bottom:10px;width:100%;text-align:left}
.list-row .grow{flex:1;min-width:0}
.list-row .grow b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .grow small{color:var(--muted);font-size:12.5px}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:13px;height:13px}
.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;border:1.5px dashed var(--border);border-radius:var(--radius)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--cond);font-size:24px;font-weight:700}
.stat span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.row-actions{align-items:center}
.row-actions .btn{margin-top:0}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.win{background:rgba(198,244,50,.15);color:var(--accent)}
.pill.loss{background:rgba(255,107,94,.15);color:var(--danger)}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,10,7,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:520px;max-height:88dvh;overflow:auto;background:var(--bg);border:1.5px solid var(--border);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet.full{height:100dvh;max-height:100dvh;border-radius:0;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 16px)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-head h2{flex:1;font-size:20px;font-weight:700}
.sheet:not(.full) .sheet-head{position:sticky;top:-22px;margin:-22px -20px 6px;padding:22px 20px 10px;background:var(--bg);z-index:2}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* chat */
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0 12px}
.bubble{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.4}
.bubble.them{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.bubble.sys{align-self:center;background:none;color:var(--muted);font-size:12px;text-align:center}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.composer .input{border-radius:999px}
.composer .send{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.composer .send svg{width:20px;height:20px}

/* result */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0}
.score .side{text-align:center}
.score .side small{display:block;font-size:12px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px}
.stepper b{font-family:var(--cond);font-size:44px;font-weight:800;min-width:40px;text-align:center}
.rate{display:flex;gap:8px;justify-content:center;margin:8px 0 4px}
.rate button svg{width:36px;height:36px}
.rate.invalid button svg path{stroke:var(--danger)}

/* match animation */
.match-pop{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#1c4a33,#0B1F17 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fade .2s}
.match-pop h1{font-family:var(--cond);font-weight:800;font-size:56px;color:var(--accent);letter-spacing:.03em;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.match-pop .vs{display:flex;align-items:center;gap:18px;margin:26px 0 10px}
.match-pop .vs .logo{border:3px solid var(--accent);animation:pop .6s .1s both cubic-bezier(.2,1.6,.4,1)}
.match-pop .vs em{font-family:var(--cond);font-style:normal;font-size:28px;font-weight:800;color:var(--muted)}
.match-pop p{color:var(--muted);max-width:300px}
.match-pop .acts{width:100%;max-width:320px;margin-top:30px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:61;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;z-index:80;animation:up .2s;white-space:nowrap}
.toast.error{background:var(--danger);color:#fff;white-space:normal;width:max-content;max-width:calc(100vw - 32px);border-radius:14px;text-align:center;line-height:1.35;cursor:pointer}

.players-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.players-grid div{text-align:center;font-size:12px;color:var(--muted);min-width:0}
.players-grid .logo{margin:0 auto 6px}
.players-grid span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- tablet / desktop ---------- */
@media (min-width:600px){
  .screen.auth{justify-content:center}
  .screen.auth .box{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:32px}
  .screen.auth .push{margin-top:32px}
  .players-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .overlay{align-items:center}
  .sheet{border-radius:22px;border-bottom:1.5px solid var(--border)}
  .sheet.full{height:min(760px,92dvh);max-height:92dvh;border-radius:22px;padding-top:22px}
}
@media (min-width:600px) and (max-width:899px){
  .screen.with-nav{max-width:720px}
}
@media (min-width:900px){
  .nav{top:0;right:auto;width:248px;flex-direction:column;border-top:0;border-right:1px solid var(--border);padding:28px 16px}
  .nav .nav-brand{display:flex;margin:0 8px 28px}
  .nav .nav-foot{display:block;margin-top:auto}
  .nav-item{flex:none;flex-direction:row;gap:12px;padding:12px 14px;border-radius:10px;font-size:13px}
  .nav-item:hover{background:var(--surface)}
  .nav-item.on{background:var(--surface)}
  .nav-item.on::before{top:10px;bottom:10px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .nav-item .dot{top:14px;left:34px}
  .screen.with-nav{max-width:none;margin:0 0 0 248px;padding:40px 48px 48px}
  .with-nav .inner{max-width:1080px}
  .with-nav .topbar .tb-logout{display:none}
  .two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:start}
  .day{font-size:16px}
  .toast{bottom:32px;left:calc(50% + 124px)}
  .screen.team-edit{max-width:760px}
}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,transparent,var(--accent),transparent) no-repeat;background-size:40% 100%;animation:load 1s linear infinite}
.busy::after{content:"";position:fixed;inset:0}
@keyframes load{from{background-position:-60% 0}to{background-position:160% 0}}
.info{color:var(--accent);font-size:14px;margin-top:14px;line-height:1.4}
.bubble .time{display:block;font-size:10.5px;opacity:.6;margin-top:3px}
.day .req{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#FFB84D}
.day.matched .req{display:none}
.pill.wait{background:rgba(255,184,77,.15);color:#FFB84D}
.setup ol{margin:16px 0 0 20px;line-height:1.75;color:var(--muted);font-size:14px}
.setup code{background:var(--surface2);color:var(--text);padding:2px 6px;border-radius:6px;font-size:13px}
.link{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;background:none;padding:0}
.link-row{margin-top:12px;text-align:right}
select.input{color-scheme:dark;font-family:var(--body);font-size:15px;font-weight:500;color:var(--text);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select.input:invalid,select.input option[value=""]{color:#6B8577}
select.input option{background:var(--surface);color:var(--text);font-family:var(--body);font-size:15px}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:1.4}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--border);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(198,244,50,.08)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.meta a{color:var(--accent);text-decoration:none;font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badges.center{justify-content:center}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:rgba(198,244,50,.12);color:var(--accent)}
.badge.warn{background:rgba(255,107,94,.15);color:var(--danger)}
.badge.lvl{background:var(--surface2);color:var(--text)}
.note{font-size:14px;line-height:1.45;margin-top:8px;color:var(--text)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--radius);background:rgba(198,244,50,.08);border:1.5px solid rgba(198,244,50,.3);margin:14px 0 4px;font-size:13.5px;line-height:1.4}
.banner .grow{flex:1}
.leaders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.leader{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;min-width:0}
.leader small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.leader .who{display:flex;align-items:center;gap:8px;margin-top:8px;min-width:0}
.leader .who b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leader .val{font-family:var(--cond);font-size:26px;font-weight:800;color:var(--accent);margin-top:4px}
.section-gap{height:8px}
.pill.fp{background:rgba(198,244,50,.15);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){ .kpis{grid-template-columns:repeat(4,1fr)} }
.kpi{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0}

.top-scorer .g{font-family:var(--cond);font-size:24px;font-weight:800;color:var(--accent)}

@media (min-width:900px){ .nav-item .cnt-dot{top:12px;left:32px} }

<body>
<div id="app"></div>
<div id="layer"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
/* Read the URL before Supabase tidies it up: password reset links and shared links. */
const BOOT_HASH = location.hash;
const RECOVERY = /type=recovery/.test(BOOT_HASH);
const LINK_ERROR = (BOOT_HASH.match(/error_description=([^&]+)/) || [])[1];
let DEEP = (() => { const m = BOOT_HASH.match(/^#(team|call)=([0-9a-f-]{36})$/); return m ? {kind:m[1], id:m[2]} : null })();

/* ================= icons ================= */
const I = {
  mark:'<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="3"/><path d="M3 20h34" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="5.5" fill="currentColor"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  mega:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 0 0 1 1h3l6 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
};
const star = (on, big) => `<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="${on?'#C6F432':'none'}" stroke="${on?'#C6F432':'#4C6B5C'}" stroke-width="${big?1.6:2}" stroke-linejoin="round"/></svg>`;
const stars = r => `<span class="stars">${[1,2,3,4,5].map(i=>star(i<=Math.round(r||0))).join('')}</span>`;

/* ================= reference data ================= */
const PROVINCES = [
  {id:'oost-vlaanderen', name:'Oost-Vlaanderen', pts:'20,30 170,20 190,90 150,180 30,170 10,80'},
  {id:'west-vlaanderen', name:'West-Vlaanderen', pts:'20,40 150,20 180,90 150,180 40,170 10,100'},
  {id:'vlaams-brabant',  name:'Vlaams-Brabant',  pts:'30,40 170,30 180,120 120,180 20,150'},
  {id:'antwerpen',       name:'Antwerpen',       pts:'20,20 180,30 170,170 40,180 10,90'},
  {id:'limburg',         name:'Limburg',         pts:'40,20 170,40 190,120 150,190 30,170 20,70'},
];
const provIcon = p => `<svg class="pi" viewBox="0 0 200 200"><polygon points="${p.pts}" fill="rgba(198,244,50,.14)" stroke="#C6F432" stroke-width="12" stroke-linejoin="round"/></svg>`;
const prov = id => PROVINCES.find(p => p.id === id) || {name:''};
const LEVELS = [
  ['recreational','Recreational'], ['provincial-4','4th Provincial'], ['provincial-3','3rd Provincial'],
  ['provincial-2','2nd Provincial'], ['provincial-1','1st Provincial'], ['national','National'],
];
const levelName = l => (LEVELS.find(x => x[0] === l) || [,''])[1];
const TCOLS = 'id,name,logo_url,province,level,hall_address,lat,lng';

/* ================= backend ================= */
const CFG = window.FAIRPLAY_CONFIG || {};
const configured = !!(CFG.url && CFG.anonKey && !/YOUR-/.test(CFG.url + CFG.anonKey) && window.supabase);
const sb = configured ? window.supabase.createClient(CFG.url, CFG.anonKey) : null;

async function q(promise){            // unwrap a Supabase response, throw on error
  const {data, error} = await promise;
  if(error) throw error;
  return data;
}
function niceErr(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if(/Invalid login credentials/i.test(m)) return 'Wrong email or password.';
  if(/Email not confirmed/i.test(m)) return 'Confirm your email first — check your inbox.';
  if(/already registered/i.test(m)) return 'There is already an account with this email.';
  if(/teams_unique_name/.test(m)) return 'A team with this name already exists in this province.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No connection to the server. Check your internet.';
  if(/email rate limit/i.test(m)) return 'Too many emails sent right now (Supabase email limit). Try again in an hour.';
  if(/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a few minutes and try again.';
  if(/should be different from the old/i.test(m)) return 'Choose a password that is different from your old one.';
  return m;
}

/* ================= helpers ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d) };
const nice = (s, opts={weekday:'long',day:'numeric',month:'long'}) => parse(s).toLocaleDateString('en-GB', opts);
const short = s => nice(s,{weekday:'short',day:'numeric',month:'short'});
const clock = ts => new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const hhmm = t => t ? String(t).slice(0,5) : '';
const initials = n => String(n||'?').split(/\s+/).filter(w=>w && /[\p{L}\d]/u.test(w[0])).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
const appUrl = () => location.href.split('#')[0];
const mapsLink = v => `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;

function logo(t, size=40){
  if(!t) t = {name:'?'};
  return t.logo_url ? `<span class="logo" style="width:${size}px;height:${size}px"><img src="${esc(t.logo_url)}" alt="" loading="lazy"></span>`
                    : `<span class="logo" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px">${esc(initials(t.name))}</span>`;
}
function avatar(p, size=44){
  return p.photo_url ? `<span class="logo" style="width:${size}px;height:${size}px"><img src="${esc(p.photo_url)}" alt="" loading="lazy"></span>`
                     : `<span class="logo" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px;background:var(--surface2);color:var(--muted)">${esc(initials(p.first_name+' '+p.last_name))}</span>`;
}
function readImg(file, size=240){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const c = document.createElement('canvas'), s = Math.min(img.width,img.height);
      c.width = c.height = size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      res(c.toDataURL('image/jpeg',.85));
    }; img.src = fr.result };
    fr.readAsDataURL(file);
  });
}
let toastT;
function toast(msg, isError){
  document.querySelector('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast' + (isError ? ' error' : ''); t.textContent = msg;
  t.onclick = () => t.remove();
  document.body.appendChild(t);
  toastT = setTimeout(()=>t.remove(), isError ? 9000 : 2800);
}
let busyN = 0;
function busy(on){
  busyN = Math.max(0, busyN + (on?1:-1));
  let el = document.querySelector('.busy');
  if(busyN && !el){ el = document.createElement('div'); el.className='busy'; document.body.appendChild(el) }
  if(!busyN && el) el.remove();
}
async function run(fn){
  busy(true);
  try{ return await fn() }
  catch(e){ console.error(e); toast(niceErr(e), true) }
  finally{ busy(false) }
}
function vibrate(p){ try{ navigator.vibrate?.(p) }catch(e){} }

/* distance between two teams' halls, in km (null when unknown) */
function km(a, b){
  if(!a || !b || a.lat == null || b.lat == null || a.lng == null || b.lng == null) return null;
  const r = Math.PI/180, dLat = (b.lat-a.lat)*r, dLng = (b.lng-a.lng)*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}
const kmLabel = t => { const d = km(st.team, t); return d == null ? '' : d < 1 ? '< 1 km' : `${Math.round(d)} km` };
async function geocode(address){
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=be&q=' + encodeURIComponent(address));
    const j = await r.json();
    return j[0] ? {lat:+j[0].lat, lng:+j[0].lon} : null;
  }catch(e){ return null }
}

/* season = 1 September – 31 August */
function season(){
  const d = new Date(), y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
  return {from:`${y}-09-01`, to:`${y+1}-08-31`, label:`${y}–${String(y+1).slice(2)}`};
}

/* ================= notifications ================= */
const notifSupported = () => 'Notification' in window;
let swReg = null;
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(()=>{});
}
function notify(title, body, tag){
  if(!notifSupported() || Notification.permission !== 'granted' || !document.hidden) return;
  const opts = {body, tag, icon:'apple-touch-icon.png', badge:'favicon-32.png'};
  if(swReg?.showNotification) swReg.showNotification(title, opts).catch(()=>{});
  else try{ const n = new Notification(title, opts); n.onclick = () => { window.focus(); n.close() } }catch(e){}
}
function updateTitle(){
  const n = st?.team ? unreadCount() + incoming().length : 0;
  document.title = (n ? `(${n}) ` : '') + 'Fair Play';
}

/* ================= state ================= */
const now = new Date();
let ui = { screen:'welcome', tab:'calendar', y:now.getFullYear(), m:now.getMonth(), sheet:null, err:'', info:'', level:'all' };
let st;               // everything loaded from the database
function resetState(){
  let province = null; try{ province = localStorage.getItem('fairplay.province') }catch(e){}
  st = { user:null, team:null, province, matches:[], rated:new Map(), myAvail:new Set(), monthAvail:{},
         teams:{}, stats:{}, convos:[], thread:null, ranking:null, teamPage:null, calls:null, season:null, isAdmin:false, admin:null };
}
resetState();
let draft = null, res = null, cform = null, channel = null;

const me = () => st.team?.id;
const other = m => m.challenger === me() ? m.o : m.c;
const otherId = m => m.challenger === me() ? m.opponent : m.challenger;
const BOOKED = ['accepted','result_pending'];
const myMatchOn = day => st.matches.find(m => m.day === day && BOOKED.includes(m.status));
const pendingWith = (day, tid) => st.matches.find(m => m.day === day && m.status === 'pending' && (m.challenger === tid || m.opponent === tid));
// a pending request I still have to answer / one where I am waiting for the other team
const needsMyAnswer = m => m.status==='pending' && (m.suggested ? m.confirmed_by !== me() : m.opponent === me());
const waitingForThem = m => m.status==='pending' && (m.suggested ? m.confirmed_by === me() : m.challenger === me());
const incoming = () => st.matches.filter(m => needsMyAnswer(m) && m.day>=todayIso());
const unreadCount = () => st.convos.filter(c => c.unread).length;
const levelIdx = l => LEVELS.findIndex(x => x[0] === l);
// "near" = same level, one higher or one lower
const levelOk = t => ui.level === 'all' || !st.team.level || !t?.level || Math.abs(levelIdx(t.level) - levelIdx(st.team.level)) <= 1;
function levelHint(t){
  if(!st.team.level || !t?.level || t.id === me()) return '';
  const d = levelIdx(t.level) - levelIdx(st.team.level);
  return d === 0 ? 'Same level' : d === 1 ? '1 level higher' : d === -1 ? '1 level lower' : d > 0 ? `${d} levels higher` : `${-d} levels lower`;
}
function remember(...teams){ teams.flat().forEach(t => { if(t?.id) st.teams[t.id] = {...st.teams[t.id], ...t} }) }

function badges(s, opts={}){
  s = s || {};
  const b = [];
  if(s.rating >= 4.5 && s.rating_count >= 3) b.push(['★ Fair play','']);
  if(s.played >= 10 && !s.no_shows && !s.late_cancels) b.push(['✓ Reliable','']);
  if(s.played >= 25) b.push(['Veteran','']);
  if(s.no_shows) b.push([`⚠ ${s.no_shows} no-show${s.no_shows>1?'s':''}`,'warn']);
  if(opts.level) b.unshift([levelName(opts.level) + (opts.hint ? ' · ' + opts.hint : ''),'lvl']);
  return b.length ? `<div class="badges ${opts.center?'center':''}">${b.map(([l,c])=>`<span class="badge ${c}">${esc(l)}</span>`).join('')}</div>` : '';
}

/* ================= loading ================= */
async function loadTeam(){
  st.team = await q(sb.from('teams').select('*, players(*)').eq('owner', st.user.id).maybeSingle());
  if(st.team){
    st.team.players.sort((a,b)=>a.position-b.position);
    st.province = st.team.province;
    remember(st.team);
  }
}
async function loadStats(ids){
  ids = [...new Set(ids)].filter(Boolean);
  if(!ids.length) return;
  const rows = await q(sb.from('team_stats').select('*').in('team_id', ids));
  rows.forEach(r => st.stats[r.team_id] = r);
}
async function loadMatches(){
  const id = me();
  st.matches = await q(sb.from('matches')
    .select(`*, c:teams!matches_challenger_fkey(${TCOLS}), o:teams!matches_opponent_fkey(${TCOLS})`)
    .or(`challenger.eq.${id},opponent.eq.${id}`).order('day'));
  st.matches.forEach(m => remember(m.c, m.o));
  const r = await q(sb.from('ratings').select('match_id,stars').eq('rater', id));
  st.rated = new Map(r.map(x => [x.match_id, x.stars]));
  await loadStats(st.matches.map(otherId));
}
async function loadMonth(){
  const start = iso(new Date(ui.y, ui.m, 1)), end = iso(new Date(ui.y, ui.m+1, 0));
  const rows = await q(sb.from('availability').select(`team_id, day, team:teams!inner(${TCOLS})`)
    .eq('team.province', st.team.province).gte('day', start).lte('day', end));
  st.monthAvail = {}; st.myAvail = new Set();
  for(const a of rows){
    if(a.team_id === me()) st.myAvail.add(a.day);
    else { (st.monthAvail[a.day] ||= []).push(a.team); remember(a.team) }
  }
  await loadStats(rows.map(a => a.team_id));
}
async function loadChats(){
  const id = me();
  const rows = await q(sb.from('messages').select('id,sender,recipient,body,created_at,read_at')
    .or(`sender.eq.${id},recipient.eq.${id}`).order('created_at', {ascending:false}).limit(500));
  const by = new Map();
  for(const m of rows){
    const o = m.sender === id ? m.recipient : m.sender;
    if(!by.has(o)) by.set(o, {id:o, last:m, unread:false});
    if(m.recipient === id && !m.read_at) by.get(o).unread = true;
  }
  st.convos = [...by.values()];
  const missing = st.convos.map(c => c.id).filter(x => !st.teams[x]);
  if(missing.length) remember(await q(sb.from('teams').select(TCOLS).in('id', missing)));
}
async function loadCalls(){
  const rows = await q(sb.from('calls').select(`*, team:teams!inner(${TCOLS})`)
    .eq('team.province', st.team.province).eq('status', 'open').gte('day', todayIso()).order('day'));
  rows.forEach(c => remember(c.team));
  st.calls = rows;
  await loadStats(rows.map(c => c.team_id));
}
async function loadAll(){
  await Promise.all([loadMatches(), loadMonth(), loadChats(), loadStats([me()]), loadCalls()]);
}
async function loadAdmin(){
  st.admin = await q(sb.rpc('admin_stats', {p_months: ui.adminMonths || 12}));
}
async function loadRanking(){
  const teams = await q(sb.from('teams').select(TCOLS).eq('province', st.team.province));
  remember(teams);
  await loadStats(teams.map(t => t.id));
  st.ranking = teams.map(t => t.id).filter(id => !st.stats[id]?.hidden);   // admin teams stay off the leaderboards
  const s = season();
  [st.season, st.scorers] = await Promise.all([
    q(sb.rpc('season_stats', {p_province: st.team.province, p_from: s.from, p_to: s.to})),
    q(sb.rpc('season_scorers', {p_province: st.team.province, p_from: s.from, p_to: s.to, p_limit: 10}))]);
}

function subscribe(){
  if(channel) sb.removeChannel(channel);
  const id = me();
  channel = sb.channel('fairplay-' + id)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:`recipient=eq.${id}`}, p => onMessage(p.new))
    .on('postgres_changes', {event:'*', schema:'public', table:'matches', filter:`opponent=eq.${id}`}, p => onMatch(p))
    .on('postgres_changes', {event:'*', schema:'public', table:'matches', filter:`challenger=eq.${id}`}, p => onMatch(p))
    .subscribe();
}
async function onMessage(msg){
  const open = ui.sheet?.type === 'chat' && ui.sheet.id === msg.sender && st.thread;
  if(open){
    if(!st.thread.msgs.some(x => x.id === msg.id)) st.thread.msgs.push(msg);
    sb.rpc('mark_read', {p_from: msg.sender});
  }
  await loadChats().catch(()=>{});
  if(open) st.convos.forEach(c => { if(c.id === msg.sender) c.unread = false });
  const from = st.teams[msg.sender]?.name || 'A team';
  if(!open) toast(`New message from ${from}`);
  notify(from, msg.body, 'chat-' + msg.sender);
  refresh();
}
async function onMatch(p){
  const before = st.matches.find(m => m.id === p.new?.id);
  await Promise.all([loadMatches(), loadMonth()]).catch(()=>{});
  if(ui.tab === 'calls') await loadCalls().catch(()=>{});
  const after = st.matches.find(m => m.id === p.new?.id);
  if(after){
    const o = other(after)?.name || 'A team', mine = after.challenger === me();
    let msg = null;
    const pairedSameDay = st.matches.find(x => x.suggested && x.status === 'pending' && x.day === after.day);
    if(p.eventType === 'INSERT' && after.suggested){
      msg = `The team you wanted to play chose another opponent — but ${o} is also still looking for ${short(after.day)}. Fair Play paired you!`;
      vibrate([120,60,120]);
    }
    else if(p.eventType === 'INSERT' && !mine){
      msg = after.call_id ? `${o} responded to your open call for ${short(after.day)}` : `${o} challenged you for ${short(after.day)}`;
      vibrate([120,60,120]);
    }
    else if(before?.status === 'pending' && after.status === 'pending' && after.suggested && after.confirmed_by && after.confirmed_by !== me())
      msg = `${o} accepted the Fair Play match for ${short(after.day)} — your turn!`;
    else if(before?.status === 'pending' && after.status === 'accepted' && (mine || after.suggested)){ celebrate(after); msg = `It's a match — friendly with ${o} on ${short(after.day)}!` }
    else if(before?.status === 'pending' && after.status === 'declined' && pairedSameDay) msg = null;   // the pairing message says it all
    else if(before?.status === 'pending' && after.status === 'declined' && (mine || after.suggested)) msg = `${o} declined ${after.suggested ? 'the Fair Play match' : 'your request'}`;
    else if(before && before.status !== 'cancelled' && after.status === 'cancelled' && after.cancelled_by !== me() && before.status !== 'pending') msg = `${o} cancelled the friendly on ${short(after.day)}`;
    else if(before?.status === 'accepted' && after.status === 'result_pending' && after.result_by !== me()) msg = `${o} entered the score — please confirm it`;
    else if(before?.status === 'result_pending' && after.status === 'accepted' && before.result_by === me()) msg = `${o} disputed the score you entered`;
    else if(before?.status === 'result_pending' && after.status === 'played' && before.result_by === me()) msg = `${o} confirmed the score`;
    else if(after.status === 'no_show' && after.no_show === me() && before?.status !== 'no_show') msg = `${o} reported that your team did not show up`;
    if(msg){ toast(msg); notify('Fair Play', msg, 'match-' + after.id) }
  }
  refresh();
}

/* ================= routing ================= */
async function route(){
  ui.sheet = null;
  if(!sb){ ui.screen = 'setup'; return render() }
  if(!st.user){ ui.screen = 'welcome'; return render() }
  await run(async () => {
    await loadTeam();
    if(!st.team){
      if(!st.province) ui.screen = 'province';
      else { newDraft(); ui.screen = 'team' }
      return;
    }
    await loadAll();
    st.isAdmin = await sb.rpc('is_admin').then(r => r.data === true, () => false);
    subscribe();
    ui.screen = 'app';
  });
  if(!['app','province','team'].includes(ui.screen)) ui.screen = 'welcome';
  render();
  if(ui.screen === 'app' && DEEP){
    const d = DEEP; DEEP = null;
    history.replaceState(null, '', appUrl());
    if(d.kind === 'team') A.teamPage(d.id);
    if(d.kind === 'call') A.tab('calls');
  }
}
function newDraft(){
  const t = st.team;
  draft = t ? {name:t.name, logo:t.logo_url, level:t.level||'', hall:t.hall_address||'',
               players:t.players.map(p=>({first:p.first_name, last:p.last_name, photo:p.photo_url}))}
            : {name:'', logo:null, level:'', hall:'', players:Array.from({length:8},()=>({first:'',last:'',photo:null}))};
  while(draft.players.length < 8) draft.players.push({first:'',last:'',photo:null});
}

const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const pct = v => v == null ? '–' : `${(+v).toFixed(0)}%`;
function vbars(rows, label, value, unit){
  const max = Math.max(1, ...rows.map(value));
  const top = rows.reduce((a, r) => value(r) > value(a) ? r : a, rows[0]);
  return `<div class="vbars" role="img" aria-label="${esc(unit)}">${rows.map(r => { const v = value(r);
      return `<div class="vbar ${v ? '' : 'zero'}" data-tip="${esc(label(r, true))}: ${v} ${esc(unit)}">
        ${r === top && v ? `<span class="v" style="bottom:${v / max * 100}%">${v}</span>` : ''}<i style="height:${v / max * 100}%"></i></div>` }).join('')}</div>
    <div class="vlabels">${rows.map(r => `<span>${esc(label(r))}</span>`).join('')}</div>`;
}
function hbars(rows, label, value, unit){
  if(!rows.length) return `<div class="hint">No data yet.</div>`;
  const max = Math.max(1, ...rows.map(value));
  return `<div class="hbars">${rows.map(r => `<div class="hbar" data-tip="${esc(label(r))}: ${value(r)} ${esc(unit)}">
    <span class="l">${esc(label(r))}</span><span class="track"><i style="width:${value(r) / max * 100}%"></i></span><span class="n">${value(r)}</span></div>`).join('')}</div>`;
}

const statsGrid = s => `<div class="stats"><div class="stat"><b>${s.played||0}</b><span>Played</span></div><div class="stat"><b>${s.won||0}</b><span>Won</span></div><div class="stat"><b>${s.drawn||0}</b><span>Draw</span></div><div class="stat"><b>${s.lost||0}</b><span>Lost</span></div></div>`;

function seasonBlock(){
  let scorers;
  const rows = st.season && st.season.filter(r => !st.stats[r.team_id]?.hidden && !(st.isAdmin && r.team_id === me()));
  if(!rows) return `<div class="empty">Loading…</div>`;
  const played = rows.filter(r => r.played > 0);
  if(!played.length) return `<div class="empty">No matches played this season yet.</div>`;
  const top = (list, key) => { const t = [...list].sort((a,b)=>(b[key]??-1)-(a[key]??-1))[0]; return t && +t[key] > 0 ? t : null };
  const rated = rows.filter(r => r.rating_count >= 3);
  const L = [
    ['Most matches', top(played,'played'), r => r.played],
    ['Most wins', top(played,'won'), r => r.won],
    ['Best fair play', rated.length ? top(rated,'rating') : null, r => (+r.rating).toFixed(1) + ' ★'],
    ['Best attack', top(played,'goals_for'), r => r.goals_for + ' goals'],
  ];
  const mine = rows.find(r => r.team_id === me());
  return `<div class="leaders">${L.map(([label, r, val]) => `<div class="leader"><small>${label}</small>
      ${r ? `<button class="who" data-act="teamPage" data-arg="${r.team_id}">${logo({name:r.name, logo_url:r.logo_url},26)}<b>${esc(r.name)}</b></button><div class="val">${esc(val(r))}</div>`
          : `<div class="hint" style="margin-top:10px">${label==='Best fair play' ? 'Needs a team with 3+ ratings' : 'Nobody yet'}</div>`}</div>`).join('')}</div>
    ${mine ? `<p class="hint" style="margin-top:10px">Your season: ${mine.played} played · ${mine.won}W ${mine.drawn}D ${mine.lost}L · goals ${mine.goals_for}–${mine.goals_against}</p>` : ''}
    <div class="label">Top scorers</div>
    ${(scorers=(st.scorers||[]).filter(r => !st.stats[r.team_id]?.hidden && !(st.isAdmin && r.team_id === me()))).length ? scorers.map((r,i)=>`<button class="top-scorer" style="width:100%;text-align:left" data-act="teamPage" data-arg="${r.team_id}"><span class="rank">${i+1}</span>
        ${avatar({photo_url:r.photo_url, first_name:r.player_name, last_name:''},36)}

function matchMeta(m){
  const o = other(m);

  return `<div class="meta"><span>${m.kickoff ? hhmm(m.kickoff) : 'Time to be decided'}</span><span>${host}</span>

function matchRow(m){
  const o = other(m), today = todayIso();
  let acts = '';
  const chat = `<button class="btn btn-outline btn-sm" data-act="chat" data-arg="${o.id}">Chat</button>`;
  const edit = `<button class="btn btn-outline btn-sm" data-act="editDetails" data-arg="${m.id}">Edit time & place</button>`;
  if(needsMyAnswer(m))
    acts = `<button class="btn btn-primary btn-sm" data-act="respond" data-arg="${m.id}|1">Accept</button>
            <button class="btn btn-outline btn-sm" data-act="respond" data-arg="${m.id}|0">Decline</button>${chat}`;
  else if(m.status==='pending' && m.suggested)
    acts = `<span class="pill wait">You accepted · waiting for ${esc(o.name)}</span>${chat}
            <button class="btn btn-danger btn-sm" data-act="respond" data-arg="${m.id}|0">Decline</button>`;
  else if(m.status==='pending')
    acts = `<span class="pill wait">Waiting</span>${chat}${edit}
            <button class="btn btn-danger btn-sm" data-act="cancelMatch" data-arg="${m.id}">Withdraw</button>`;
  else if(m.status==='accepted' && m.day<=today)
    acts = `<button class="btn btn-primary btn-sm" data-act="result" data-arg="${m.id}">Enter result</button>${chat}
            <button class="btn btn-danger btn-sm" data-act="noShow" data-arg="${m.id}">They didn't show up</button>`;
  else if(m.status==='accepted')
    acts = `${chat}${edit}<button class="btn btn-danger btn-sm" data-act="cancelMatch" data-arg="${m.id}">Cancel</button>`;
  else if(m.status==='result_pending' && m.result_by===me())
    acts = `<span class="pill wait">Score sent · waiting for confirmation</span>${chat}`;
  else if(m.status==='result_pending')
    acts = `<button class="btn btn-primary btn-sm" data-act="result" data-arg="${m.id}">Confirm score</button>${chat}`;
  const score = m.status==='result_pending' ? (() => { const [a,b] = myScore(m); return `<span class="pill">${a} – ${b}</span>` })() : '';
  return `<div class="list-row" style="display:block"><div style="display:flex;gap:12px;align-items:center">
    <button data-act="teamPage" data-arg="${o.id}" style="flex:none">${logo(o,40)}</button>
    <span class="grow"><b>${esc(o.name)}</b><small>${nice(m.day)}${m.call_id?' · open call':''}</small>
      ${m.suggested && m.status==='pending' ? `<div class="badges"><span class="badge">⚡ Fair Play match</span></div>` : ''}</span>${score}</div>
    ${m.suggested && m.status==='pending' ? `<p class="hint">You both wanted to play the same team that day, but it chose another opponent. You are both still free — play each other! Both teams need to accept.</p>` : ''}
    ${matchMeta(m)}
    <div class="row-actions">${acts}</div></div>`;
}
const myScore = m => m.challenger===me() ? [m.challenger_score, m.opponent_score] : [m.opponent_score, m.challenger_score];
function resultRow(m){
  const o = other(m);

result: ({mid}) => {
  const m = st.matches.find(x=>x.id===mid), o = other(m), t = st.team;
  const mode = m.status==='played' ? 'rate' : m.status==='result_pending' ? 'confirm' : 'enter';
  const [sm, so] = myScore(m), shown = mode==='enter' ? res : {my:sm, their:so};
  const step = k => mode!=='enter' ? `<div class="stepper"><b>${shown[k]}</b></div>`
    : `<div class="stepper"><button class="icon-btn" data-act="score" data-arg="${k}|-1" aria-label="Minus">${I.minus}</button><b>${res[k]}</b><button class="icon-btn" data-act="score" data-arg="${k}|1" aria-label="Plus">${I.plus}</button></div>`;
  const title = {enter:'Enter result', confirm:'Confirm the score', rate:'Rate your opponent'}[mode];
  const sub = mode==='confirm' ? `${esc(o.name)} entered this score. Is it correct?`
    : mode==='enter' ? `${esc(o.name)} will be asked to confirm the score.` : 'Score confirmed by both teams.';
  return `<div class="sheet"><div class="sheet-head"><h2>${title}</h2>${closeBtn}</div>
    <p class="lead" style="margin-top:-8px">${nice(m.day)} · ${sub}</p>
    <div class="score"><div class="side">${step('my')}<small>${esc(t.name)}</small></div><b style="color:var(--muted)">–</b><div class="side">${step('their')}<small>${esc(o.name)}</small></div></div>
    <div class="label" style="text-align:center">Rate ${esc(o.name)}'s fair play</div>
    <div class="rate ${res.bad?'invalid':''}">${[1,2,3,4,5].map(i=>`<button data-act="rate" data-arg="${i}" aria-label="${i} stars">${star(i<=res.stars,true)}</button>`).join('')}</div>
    <p class="form-error" style="text-align:center">${res.bad?'Give a rating to save':''}</p>
    ${scorersForm(mode==='enter' ? res.my : sm)}
    <button class="btn btn-primary" style="margin-top:14px" data-act="saveResult" data-arg="${mid}">${mode==='confirm'?'Confirm score':'Save'}</button>
    ${mode==='confirm' ? `<button class="btn btn-danger" data-act="disputeResult" data-arg="${mid}">Score is wrong</button>` : ''}</div>`;
},
};

function scorersForm(myGoals){
  if(!res.scorers) return `<div class="hint" style="text-align:center">Loading scorers…</div>`;
  const total = Object.values(res.scorers).reduce((a,b)=>a+b,0);
  if(!myGoals) return '';
  return `<div class="label" style="margin-top:22px">Your scorers <span style="text-transform:none;letter-spacing:0;font-weight:600">· optional · ${total} of ${myGoals} goal${myGoals===1?'':'s'}</span></div>
    <div class="card" style="padding:4px 14px">${st.team.players.map(p => { const n = res.scorers[p.id] || 0; return `<div class="scorer">${avatar(p,32)}
      <span class="nm">${esc(p.first_name)} ${esc(p.last_name)}</span>
      <div class="stepper"><button class="icon-btn" data-act="goal" data-arg="${p.id}|-1" ${n?'':'disabled'} aria-label="Minus">${I.minus}</button><b>${n}</b>
      <button class="icon-btn" data-act="goal" data-arg="${p.id}|1" ${total>=myGoals?'disabled':''} aria-label="Plus">${I.plus}</button></div></div>` }).join('')}</div>`;
}

/* ================= render ================= */
function render(){
  document.getElementById('app').innerHTML = S[ui.screen]();
  renderSheet();
}
function renderSheet(){
  const L = document.getElementById('layer');
  const keep = document.getElementById('msgIn')?.value;
  L.innerHTML = ui.sheet ? `<div class="overlay" data-act="backdrop">${SH[ui.sheet.type](ui.sheet)}</div>` : '';
  const inp = document.getElementById('msgIn'); if(inp && keep) inp.value = keep;
  const msgs = document.getElementById('msgs'); if(msgs) msgs.scrollTop = msgs.scrollHeight;
  document.body.style.overflow = ui.sheet ? 'hidden' : '';
  updateTitle();
}
function openSheet(s){ ui.sheet = s; renderSheet() }
function refresh(){ if(ui.screen==='app' || ui.screen==='team') document.getElementById('app').innerHTML = S[ui.screen](); renderSheet() }

/* ================= actions ================= */
async function uploadImage(dataUrl, tag){
  const blob = await (await fetch(dataUrl)).blob();
  const path = `${st.user.id}/${Date.now()}-${tag}-${Math.random().toString(36).slice(2,8)}.jpg`;
  try{ await q(sb.storage.from('media').upload(path, blob, {contentType:'image/jpeg'})) }
  catch(e){ throw new Error('Photo upload failed: ' + niceErr(e)) }
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
function shareWA(text){ window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener') }
function checkPw(form){
  const pw = form.querySelector('#pw').value, pw2 = form.querySelector('#pw2')?.value;
  const bad1 = pw.length < 8, bad2 = pw2 !== undefined && pw2 !== pw;
  form.querySelector('#f-pw').classList.toggle('invalid', bad1);
  form.querySelector('#f-pw2')?.classList.toggle('invalid', !bad1 && bad2);
  return bad1 || bad2 ? null : pw;
}

const A = {
  go(s){ ui.err=''; if(s!=='login') ui.info=''; if(s==='app'){ ui.sheet=null; ui.screen='app'; render(); return } ui.screen=s; window.scrollTo(0,0); render() },

    if(t==='board') run(async()=>{ await Promise.all([loadRanking(), loadStats([me()]), loadMatches()]); refresh() });
    if(t==='chat') run(async()=>{ await loadChats(); refresh() });
    if(t==='admin') run(async()=>{ await loadAdmin(); refresh() });
    if(t==='calls') run(async()=>{ await Promise.all([loadCalls(), loadMatches()]); refresh() });
  },
  levelFilter(v){ ui.level = v; refresh() },
  adminMonths(v){ ui.adminMonths = +v; run(async()=>{ await loadAdmin(); refresh() }) },
  logout(){ run(async()=>{
    if(channel){ sb.removeChannel(channel); channel=null }
    st.user = null;
    await sb.auth.signOut();
    resetState(); ui.tab='calendar'; ui.info=''; ui.err='';
    route();
  })},
  pickProv(id){
    st.province = id; try{ localStorage.setItem('fairplay.province', id) }catch(e){}
    if(!st.team){ newDraft(); ui.screen='team'; render(); return }
    run(async()=>{ await q(sb.from('teams').update({province:id}).eq('id', me())); toast('Province changed'); await route() });
  },
  editTeam(){ newDraft(); ui.sheet=null; ui.screen='team'; window.scrollTo(0,0); render() },
  addPlayer(){ draft.players.push({first:'',last:'',photo:null}); render() },
  rmPlayer(i){ draft.players.splice(+i,1); render() },
  saveTeam(){
    let first=null;
    const mark=(el,bad)=>{ el.classList.toggle('invalid',bad); if(bad&&!first) first=el };
    mark(document.getElementById('logoBox'), !draft.logo);
    mark(document.getElementById('f-tname'), !draft.name.trim());
    mark(document.getElementById('f-level'), !draft.level);
    document.querySelectorAll('[data-req]').forEach(el=>mark(el,!el.value.trim()));
    const err = document.getElementById('teamErr');
    if(first){ err.textContent='Fill in all fields marked in red.'; first.scrollIntoView({behavior:'smooth',block:'center'}); return }
    err.textContent='';
    run(async()=>{
      const logoUrl = draft.logo.startsWith('data:') ? await uploadImage(draft.logo,'logo') : draft.logo;
      const hall = draft.hall.trim() || null;
      const row = {name:draft.name.trim(), province:st.province, logo_url:logoUrl, level:draft.level, hall_address:hall};
      if(!hall) Object.assign(row, {lat:null, lng:null});
      else if(hall !== st.team?.hall_address || st.team?.lat == null){
        const pos = await geocode(hall);
        Object.assign(row, pos || {lat:null, lng:null});
        if(!pos) toast('Saved, but the hall address was not found on the map — distances will not be shown.', true);
      }
      const team = st.team ? await q(sb.from('teams').update(row).eq('id', me()).select().single())
                           : await q(sb.from('teams').insert(row).select().single());
      const players = await Promise.all(draft.players.map(async (p,i)=>({
        team_id:team.id, position:i, first_name:p.first.trim(), last_name:p.last.trim(),
        photo_url: p.photo?.startsWith('data:') ? await uploadImage(p.photo,'p'+i) : (p.photo || null) })));
      await q(sb.from('players').upsert(players, {onConflict:'team_id,position'}));
      await q(sb.from('players').delete().eq('team_id', team.id).gte('position', players.length));
      try{ localStorage.removeItem('fairplay.province') }catch(e){}
      if(!document.querySelector('.toast.error')) toast('Team saved');
      ui.tab='calendar';
      await route();
    });
  },
  month(d){
    ui.m += +d; if(ui.m<0){ui.m=11;ui.y--} if(ui.m>11){ui.m=0;ui.y++}
    refresh(); run(async()=>{ await Promise.all([loadMonth(), loadMatches()]); refresh() });
  },
  day(date){ openSheet({type:'day', date}) },
  close(){ ui.sheet=null; st.thread=null; renderSheet(); refresh() },
  backdrop(_,el,e){ if(e.target===el) A.close() },
  togglePlace(date){ run(async()=>{
    if(st.myAvail.has(date)){ await q(sb.from('availability').delete().eq('team_id', me()).eq('day', date)); toast('Removed from this day') }
    else { await q(sb.from('availability').insert({team_id:me(), day:date})); toast('Your team is placed') }
    await loadMonth(); refresh();
  })},
  challenge(arg){
    const [date,id] = arg.split('|');
    cform = {kickoff:'', host: st.team.hall_address ? 'me' : '', venue: st.team.hall_address || ''};
    openSheet({type:'challenge', date, id});

  cfHost(v){

    cform.host = v;
    cform.venue = v==='me' ? (st.team.hall_address || '') : v==='them' ? (st.teams[t.id]?.hall_address || '') : '';
    renderSheet();
  },
  sendChallenge(arg){ const [date,id] = arg.split('|'); run(async()=>{
    const host = cform.host==='me' ? me() : cform.host==='them' ? id : null;
    await q(sb.rpc('challenge', {p_opponent:id, p_day:date, p_kickoff:cform.kickoff || null, p_venue:host ? cform.venue : null, p_host:host}));
    await loadMatches();
    ui.sheet = {type:'day', date}; refresh();
    toast(`Request sent to ${st.teams[id]?.name || 'the team'}`);
  })},
  editDetails(mid){
    const m = st.matches.find(x=>x.id===mid);
    cform = {kickoff: hhmm(m.kickoff), host: m.host===me() ? 'me' : m.host ? 'them' : '', venue: m.venue || ''};
    openSheet({type:'details', mid});
  },
  saveDetails(mid){ run(async()=>{
    const m = st.matches.find(x=>x.id===mid);
    const host = cform.host==='me' ? me() : cform.host==='them' ? otherId(m) : null;
    await q(sb.rpc('update_match_details', {p_match:mid, p_kickoff:cform.kickoff || null, p_venue:host ? cform.venue : '', p_host:host}));
    await loadMatches(); ui.sheet=null; refresh(); toast('Time & place saved');
  })},
  respond(arg){ const [mid, yes] = arg.split('|'); run(async()=>{
    await q(sb.rpc('respond', {p_match:mid, p_accept: yes==='1'}));
    await Promise.all([loadMatches(), loadMonth(), loadCalls()]);
    const m = st.matches.find(x=>x.id===mid);
    if(yes==='1' && m?.status==='accepted'){ ui.sheet=null; refresh(); celebrate(m) }
    else if(yes==='1'){ refresh(); toast(`Accepted — waiting for ${other(m).name} to accept too`) }
    else { toast('Request declined'); refresh() }
  })},
  cancelMatch(mid){
    const m = st.matches.find(x=>x.id===mid), o = other(m);
    const what = m.status==='pending' ? `Withdraw your request to ${o.name}?` : `Cancel the friendly against ${o.name} on ${nice(m.day)}?\n\nCancelling a planned friendly is shown on your team's record.`;
    if(!confirm(what)) return;
    run(async()=>{ await q(sb.rpc('cancel_match', {p_match:mid})); await Promise.all([loadMatches(), loadMonth()]); toast(m.status==='pending'?'Request withdrawn':'Friendly cancelled'); refresh() });
  },
  noShow(mid){
    const o = other(st.matches.find(x=>x.id===mid));
    if(!confirm(`Report that ${o.name} did not show up?\n\nThis is shown on their team page. Only do this if they really did not come.`)) return;
    run(async()=>{ await q(sb.rpc('report_no_show', {p_match:mid})); await loadMatches(); toast('No-show reported'); refresh() });
  },
  chat(id){
    st.thread = null; ui.sheet = {type:'chat', id}; refresh();
    run(async()=>{
      if(!st.teams[id]) remember(await q(sb.from('teams').select(TCOLS).eq('id', id).single()));
      const msgs = await q(sb.from('messages').select('id,sender,recipient,body,created_at')
        .or(`and(sender.eq.${me()},recipient.eq.${id}),and(sender.eq.${id},recipient.eq.${me()})`)
        .order('created_at').limit(500));
      if(ui.sheet?.type!=='chat' || ui.sheet.id!==id) return;
      st.thread = {id, msgs};
      await q(sb.rpc('mark_read', {p_from:id}));
      st.convos.forEach(c=>{ if(c.id===id) c.unread=false });
      refresh();
      document.getElementById('msgIn')?.focus();
    });
  },
  teamPage(id){
    st.teamPage = null; openSheet({type:'team', id});
    run(async()=>{
      const t = await q(sb.from('teams').select(`${TCOLS}, players(*)`).eq('id', id).single());
      t.players.sort((a,b)=>a.position-b.position);
      const sea = season();
      const [, g] = await Promise.all([loadStats([id]),
        q(sb.from('goals').select('player_id, goals, match:matches!inner(status,day)').eq('team_id', id)
          .eq('match.status', 'played').gte('match.day', sea.from).lte('match.day', sea.to))]);
      t.goals = {}; g.forEach(r => { if(r.player_id) t.goals[r.player_id] = (t.goals[r.player_id]||0) + r.goals });

  shareTeam(id){

    shareWA(`Check out ${t.name} on Fair Play — futsal friendlies in ${prov(t.province).name}: ${appUrl()}#team=${id}`);
  },
  newCall(){ cform = {day:'', kickoff:'', hasHall: !!st.team.hall_address, venue: st.team.hall_address || '', note:''}; openSheet({type:'newCall'}) },
  cfHall(v){ cform.hasHall = v==='1'; if(cform.hasHall && !cform.venue) cform.venue = st.team.hall_address || ''; renderSheet() },
  postCall(){
    const bad = !cform.day || cform.day < todayIso();
    document.getElementById('f-cday').classList.toggle('invalid', bad);
    if(bad) return;
    run(async()=>{
      await q(sb.from('calls').insert({team_id:me(), day:cform.day, kickoff:cform.kickoff || null, has_hall:cform.hasHall,

    await q(sb.rpc('respond_to_call', {p_call:id}));
    await loadMatches(); refresh();
    toast(`Request sent to ${st.teams[c.team_id]?.name || 'the team'}`);
  })},
  cancelCall(id){
    if(!confirm('Cancel this open call? Teams that responded will no longer be able to join.')) return;
    run(async()=>{
      await q(sb.from('calls').update({status:'cancelled'}).eq('id', id));
      const pend = st.matches.filter(m => m.call_id===id && m.status==='pending');
      for(const m of pend) await q(sb.rpc('respond', {p_match:m.id, p_accept:false}));
      await Promise.all([loadCalls(), loadMatches()]); refresh(); toast('Call cancelled');
    });
  },
  shareCall(id){
    const c = st.calls.find(x=>x.id===id), t = st.teams[c.team_id];
    shareWA(`${t.name} is looking for a futsal friendly on ${nice(c.day)}${c.kickoff?' at '+hhmm(c.kickoff):''}${c.has_hall&&c.venue?' in '+c.venue:''}. Interested? ${appUrl()}#call=${id}`);
  },
  result(mid){
    const m = st.matches.find(x=>x.id===mid);
    res = {my:0, their:0, stars: st.rated.get(mid) || 0, bad:false, scorers: m.status==='accepted' ? {} : null};
    openSheet({type:'result', mid});
    if(!res.scorers) run(async()=>{
      const rows = await q(sb.from('goals').select('player_id,goals').eq('match_id', mid).eq('team_id', me()));
      res.scorers = {}; rows.forEach(r => { if(r.player_id) res.scorers[r.player_id] = r.goals });
      if(ui.sheet?.type==='result' && ui.sheet.mid===mid) renderSheet();
    });
  },
  score(arg){
    const [k,d] = arg.split('|'); res[k] = Math.max(0, Math.min(99, res[k] + +d));
    if(k==='my'){ // never more scorers than goals
      let over = Object.values(res.scorers||{}).reduce((a,b)=>a+b,0) - res.my;
      for(const id of Object.keys(res.scorers||{}).reverse()){ while(over>0 && res.scorers[id]>0){ res.scorers[id]--; over-- } }
    }
    renderSheet();
  },
  goal(arg){ const [id,d] = arg.split('|'); res.scorers[id] = Math.max(0, (res.scorers[id]||0) + +d); if(!res.scorers[id]) delete res.scorers[id]; renderSheet() },
  rate(n){ res.stars = +n; res.bad=false; renderSheet() },
  saveResult(mid){
    if(!res.stars){ res.bad=true; renderSheet(); return }
    const m = st.matches.find(x=>x.id===mid);
    run(async()=>{
      if(m.status==='result_pending') await q(sb.rpc('confirm_result', {p_match:mid, p_stars:res.stars}));
      else await q(sb.rpc('submit_result', {p_match:mid, p_my_score:res.my, p_their_score:res.their, p_stars:res.stars}));
      if(res.scorers){
        const list = Object.entries(res.scorers).filter(([,n])=>n>0).map(([player_id, goals])=>({player_id, goals}));
        await q(sb.rpc('set_scorers', {p_match:mid, p_scorers:list}));
      }
      ui.sheet=null;
      toast(m.status==='result_pending' ? 'Score confirmed' : m.status==='played' ? 'Rating saved' : `Score sent — ${other(m).name} will confirm it`);
      await loadMatches();
      if(ui.tab==='board') await Promise.all([loadStats([me()]), loadRanking()]);
      refresh();
    });
  },
  disputeResult(mid){
    if(!confirm('Reject this score? It will be removed and you can agree on the right score in the chat.')) return;
    run(async()=>{ await q(sb.rpc('dispute_result', {p_match:mid})); ui.sheet=null; await loadMatches(); refresh(); toast('Score rejected') });
  },
  enableNotif(){
    if(!notifSupported()) return toast('Notifications are not supported here. On iPhone: add Fair Play to your home screen first.', true);
    Notification.requestPermission().then(p => {
      toast(p==='granted' ? 'Notifications are on' : 'Notifications are blocked — allow them in your browser settings', p!=='granted');
      refresh();
    });
  },
  changePw(){ openSheet({type:'password'}) },
  deleteAccount(){
    if(!confirm('Delete your account?\n\nYour team, players, chats and matches will be removed for good.')) return;
    if((prompt('Type DELETE to confirm') || '').trim().toUpperCase() !== 'DELETE') return toast('Account not deleted');
    run(async()=>{
      const uid = st.user.id;
      try{
        const files = await q(sb.storage.from('media').list(uid, {limit:1000}));
        if(files.length) await sb.storage.from('media').remove(files.map(f => `${uid}/${f.name}`));
      }catch(e){ console.warn('could not remove photos', e) }
      await q(sb.rpc('delete_my_account'));
      if(channel){ sb.removeChannel(channel); channel=null }
      st.user = null;
      await sb.auth.signOut().catch(()=>{});
      try{ localStorage.removeItem('fairplay.province') }catch(e){}
      resetState(); ui.tab='calendar'; await route();
      toast('Your account has been deleted');
    });
  },
};

const celebrated = new Set();
function celebrate(m){
  if(celebrated.has(m.id)) return;
  celebrated.add(m.id);
  const o = other(m), t = st.team;
  const el = document.createElement('div'); el.className='match-pop';
  el.innerHTML = `<h1>IT'S A MATCH!</h1><div class="vs">${logo(t,84)}<em>VS</em>${logo(o,84)}</div>
    <p>${esc(t.name)} plays ${esc(o.name)} on ${nice(m.day)}${m.kickoff?' at '+hhmm(m.kickoff):''}.</p>
    <div class="acts"><button class="btn btn-primary" id="mp-chat">Open chat</button><button class="btn btn-outline" id="mp-close">Back</button></div>`;
  document.body.appendChild(el);
  const done = () => { el.remove(); document.querySelectorAll('.confetti').forEach(c=>c.remove()) };
  el.querySelector('#mp-close').onclick = done;
  el.querySelector('#mp-chat').onclick = () => { done(); A.chat(o.id) };
  for(let i=0;i<90;i++){
    const c = document.createElement('i'); c.className='confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = ['#C6F432','#EEF5EF','#5EE2A0','#FFB84D'][i%4];
    c.style.animationDuration = (1.6+Math.random()*1.6)+'s';
    c.style.animationDelay = Math.random()*.5+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(), 4000);
  }
  vibrate([80,50,80,50,250]);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(busyN && el.dataset.act!=='close' && el.dataset.act!=='backdrop') return;   // ignore double taps while saving
  const fn = A[el.dataset.act]; if(fn) fn(el.dataset.arg, el, e);
});
document.addEventListener('input', e => {
  const c = e.target.dataset.cf;
  if(c != null && cform){ cform[c] = e.target.value; return }
  const k = e.target.dataset.draft; if(k==null || !draft) return;
  if(['name','level','hall'].includes(k)) draft[k] = e.target.value;
  else { const [i,f] = k.split('.'); draft.players[+i][f] = e.target.value }
  const holder = e.target.closest('.field') || e.target;
  if(e.target.value.trim()) holder.classList.remove('invalid');
});
document.addEventListener('change', async e => {
  if(e.target.dataset.draft === 'level'){ draft.level = e.target.value; e.target.closest('.field').classList.toggle('invalid', !draft.level); return }
  const k = e.target.dataset.file, file = e.target.files?.[0]; if(!k || !file) return;
  try{
    const data = await readImg(file, k==='logo'?320:200);
    if(k==='logo') draft.logo = data; else draft.players[+k.slice(1)].photo = data;
    render();
  }catch(err){ toast('Could not read that image', true) }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, f = form.dataset.form;
  if(f==='msg'){
    const inp = document.getElementById('msgIn'), body = inp.value.trim(); if(!body || !st.thread) return;
    const id = ui.sheet.id; inp.value = '';
    run(async()=>{
      const row = await q(sb.from('messages').insert({sender:me(), recipient:id, body}).select('id,sender,recipient,body,created_at').single());
      if(st.thread?.id===id && !st.thread.msgs.some(x=>x.id===row.id)) st.thread.msgs.push(row);
      renderSheet(); document.getElementById('msgIn')?.focus();
      loadChats().catch(()=>{});
    });
    return;
  }
  if(busyN) return;
  const err = form.querySelector('.form-error'); err.textContent='';
  if(f==='changepw' || f==='newpw'){
    const pw = checkPw(form); if(!pw) return;
    run(async()=>{
      try{ await q(sb.auth.updateUser({password:pw})) }catch(x){ err.textContent = niceErr(x); return }
      toast('Password saved');
      if(f==='newpw'){ ui.err=''; await route() } else { ui.sheet=null; renderSheet() }
    });
    return;
  }
  const ev = document.getElementById('email').value.trim().toLowerCase();
  const badE = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ev);
  document.getElementById('f-email').classList.toggle('invalid', badE);
  if(f==='forgot'){
    if(badE) return;
    run(async()=>{
      try{ await q(sb.auth.resetPasswordForEmail(ev, {redirectTo: appUrl()})) }catch(x){ err.textContent = niceErr(x); return }
      ui.info = `If there is an account for ${ev}, we sent a link to choose a new password. Check your inbox (and spam).`;
      ui.err = ''; render();
    });
    return;
  }
  const pv = document.getElementById('pw').value;
  const badP = f==='signup' ? pv.length < 8 : !pv;
  document.getElementById('f-pw').classList.toggle('invalid', badP);
  if(badE || badP) return;
  busy(true);
  (async()=>{
    try{
      if(f==='login'){
        const {data, error} = await sb.auth.signInWithPassword({email:ev, password:pv});
        if(error) throw error;
        st.user = data.user;
      } else {
        const {data, error} = await sb.auth.signUp({email:ev, password:pv, options:{emailRedirectTo: appUrl()}});
        if(error) throw error;
        if(!data.session){        // email confirmation is switched on in Supabase
          ui.info = `We sent a confirmation link to ${ev}. Open it, then log in here.`;
          ui.err = ''; ui.screen = 'login'; render(); return;
        }
        st.user = data.user;
      }
      ui.err = ui.info = '';
      busy(false); await route(); busy(true);
    }catch(x){ err.textContent = niceErr(x) }
    finally{ busy(false) }
  })();
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && ui.sheet) A.close() });
// Coming back to the app (e.g. reopening it on the phone): fetch anything missed while away.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible' && ui.screen==='app' && st.team && !busyN)
    run(async()=>{ await loadAll(); refresh() });
});

/* ================= start ================= */
(async()=>{
  if(!sb){ route(); return }
  let recovering = RECOVERY;
  sb.auth.onAuthStateChange((event, session) => {
    if(event==='PASSWORD_RECOVERY'){ recovering = true; st.user = session?.user || st.user; ui.screen='newpw'; render() }
    else if(event==='SIGNED_OUT' && st.user){ resetState(); route() }
  });
  const {data:{session}} = await sb.auth.getSession();
  st.user = session?.user || null;
  if(recovering && st.user){ ui.screen = 'newpw'; history.replaceState(null, '', appUrl()); render(); return }
  if(LINK_ERROR){
    ui.screen = 'login'; ui.err = decodeURIComponent(LINK_ERROR.replace(/\+/g,' ')) + ' — request a new link.';
    history.replaceState(null, '', appUrl()); render(); return;
  }
  route();
})();
</script>
